services:
  - type: web
    name: vendedoria
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: TOGETHER_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: RENDER_EXTERNAL_HOSTNAME
        fromService:
          type: web
          name: vendedoria
          property: host
    disk:
      name: vendedoria-data
      mountPath: /app/data
      sizeGB: 1
